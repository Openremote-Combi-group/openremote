# OpenRemote v3
#
# Profile that runs the stack by default on https://localhost using a self-signed SSL certificate,
# but optionally on https://$OR_HOSTNAME with an auto generated SSL certificate from Letsencrypt.
#
# It is configured to use the AWS logging driver.
#
volumes:
  proxy-data:
  manager-data:
  # postgresql-data:  # Not needed when using local PostgreSQL

services:
  proxy:
    image: openremote/proxy:${PROXY_VERSION:-latest}
    restart: always
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "80:80" # Needed for SSL generation using letsencrypt
      - "${OR_SSL_PORT:-443}:443"
      - "8883:8883"
      - "127.0.0.1:8404:8404" # Localhost metrics access
      - "${PRIVATE_IP:-127.0.0.1}:8404:8404" # Allows to also expose metrics on a given IP address,
        # intended to be IP of the interface of the private subnet of the EC2 VM
    volumes:
      - proxy-data:/deployment
    environment:
      LE_EMAIL: ${OR_EMAIL_ADMIN:-}
      DOMAINNAME: ${OR_HOSTNAME:-localhost}
      DOMAINNAMES: ${OR_ADDITIONAL_HOSTNAMES:-}
      # USE A CUSTOM PROXY CONFIG - COPY FROM https://raw.githubusercontent.com/openremote/proxy/main/haproxy.cfg
      #HAPROXY_CONFIG: '/data/proxy/haproxy.cfg'

  # postgresql:
  #   # Commented out - using local PostgreSQL instead
  #   restart: always
  #   image: openremote/postgresql:${POSTGRESQL_VERSION:-latest}
  #   shm_size: 128mb
  #   volumes:
  #     - postgresql-data:/var/lib/postgresql/data
  #     - manager-data:/storage

  keycloak:
    restart: always
    image: openremote/keycloak:${KEYCLOAK_VERSION:-latest}
    # depends_on:
    #   postgresql:
    #     condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deployment:/deployment
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:-secret}
      KC_HOSTNAME: ${OR_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${OR_SSL_PORT:--1}
      # PostgreSQL connection to local host
      KC_DB_URL_HOST: ${KC_DB_URL_HOST:-host.docker.internal}
      KC_DB_URL_PORT: ${KC_DB_URL_PORT:-5432}
      KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE:-openremote}
      KC_DB_SCHEMA: ${KC_DB_SCHEMA:-public}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-postgres}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-postgres}

  manager:
    #    privileged: true
    restart: always
    image: openremote/manager:${MANAGER_VERSION:-latest}
    depends_on:
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8405:8405" # Localhost metrics access
      - "${PRIVATE_IP:-127.0.0.1}:8405:8405" # Allows to also expose metrics on a given IP address,
        # intended to be IP of the interface of the private subnet of the EC2 VM
    environment:
      OR_SETUP_TYPE:
      OR_ADMIN_PASSWORD:
      OR_SETUP_RUN_ON_RESTART:
      OR_EMAIL_HOST:
      OR_EMAIL_USER:
      OR_EMAIL_PASSWORD:
      OR_EMAIL_X_HEADERS:
      OR_EMAIL_FROM:
      OR_EMAIL_ADMIN:
      OR_METRICS_ENABLED: ${OR_METRICS_ENABLED:-true}
      OR_HOSTNAME: ${OR_HOSTNAME:-localhost}
      OR_ADDITIONAL_HOSTNAMES:
      OR_SSL_PORT: ${OR_SSL_PORT:--1}
      OR_DEV_MODE: ${OR_DEV_MODE:-false}

      # Database connection to local host
      OR_DB_VENDOR: ${OR_DB_VENDOR:-postgres}
      OR_DB_HOST: ${OR_DB_HOST:-host.docker.internal}
      OR_DB_PORT: ${OR_DB_PORT:-5432}
      OR_DB_NAME: ${OR_DB_NAME:-openremote}
      OR_DB_SCHEMA: ${OR_DB_SCHEMA:-openremote}
      OR_DB_USER: ${OR_DB_USER:-postgres}
      OR_DB_PASSWORD: ${OR_DB_PASSWORD:-postgres}

      # The following variables will configure the demo
      OR_FORECAST_SOLAR_API_KEY:
      OR_OPEN_WEATHER_API_APP_ID:
      OR_SETUP_IMPORT_DEMO_AGENT_KNX:
      OR_SETUP_IMPORT_DEMO_AGENT_VELBUS:
    volumes:
      - manager-data:/storage

  mcp:
    build:
      context: ./tools/mcp/openremote-mcp-server
    image: openremote/mcp:${MCP_VERSION:-latest}
    restart: always
    # depends_on:
    #   postgresql:
    #     condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "tail -f /dev/null"]
    environment:
      PGHOST: ${PGHOST:-host.docker.internal}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-openremote}
      PGSSL: ${PGSSL:-false}
    # No ports exposed; communicates via stdio when invoked
    # Example host invocation: docker compose exec -T mcp node index.mjs
